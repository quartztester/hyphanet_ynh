    sha256 = "18c4a0095d5c1da6b817592e767bb23d29dd2f560ad74df75ff3961dbde25b79"
    rename = "slf4j-api-1.7.25.jar"

    # same seed list upstream's debian/rules builds seednodes.fref from
    [resources.sources.seedrefs]

    sha256 = "d253a6dde59e138698aaaaee546461d2f1f6c8bd2aa38ecdd347df17cf90d6f0"
    rename = "pebble-3.1.5.jar"

    [resources.sources.unbescape]
    url = "https://repo1.maven.org/maven2/org/unbescape/unbescape/1.1.6.RELEASE/unbescape-1.1.6.RELEASE.jar"
    sha256 = "597cf87d5b1a4f385b9d1cec974b7b483abb3ee85fc5b3f8b62af8e4bec95c2c"
    rename = "unbescape-1.1.6.RELEASE.jar"


    sha256 = "0b19bd500d7742a491bed13a5be3b56c7c6afe5edd3d2c54b5970d55491bf1b0"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8444

    [resources.apt]
    packages = "default-jre-headless, libservice-wrapper-java"
